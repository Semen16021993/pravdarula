        '200':
          description: Payment created
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4enekjmqshm6ri0jtjl
        tag: "$latest"
        service_account_id: ajeqeg0vt7chvaidi63g
        payload_format_version: "0.1"
  /api/payments/check:
    post:
      operationId: checkPayment
      responses:
        '200':
          description: Payment status
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: d4enekjmqshm6ri0jtjl
        tag: "$latest"
        service_account_id: ajeqeg0vt7chvaidi63g
        payload_format_version: "0.1"
  /v1/webhook:
